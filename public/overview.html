<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<base href="__BASE_HREF__">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Übersicht – Duett</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="site-header-titles">
        <h1><a href="." class="logo-link">Duett</a></h1>
        <p class="subtitle">Übersicht aller Sessions</p>
      </div>
    </header>

    <section id="overview-gate-card" class="card">
      <h2>Passwort erforderlich</h2>
      <p class="field-hint">Diese Übersichtsseite ist mit einem separaten, betreiberseitig gesetzten Passwort geschützt (Docker-Variable <code>OVERVIEW_PASSWORD</code>).</p>
      <form id="overview-auth-form">
        <input type="password" id="overview-password-input" required placeholder="Passwort" autocomplete="current-password">
        <button type="submit">Entsperren</button>
      </form>
      <p id="overview-auth-error" class="error hidden"></p>
    </section>

    <section id="overview-list-card" class="card hidden">
      <h2>Alle Sessions</h2>
      <div id="overview-list" class="stream-list">
        <p class="empty-state">Lade …</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
